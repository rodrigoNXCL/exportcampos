[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

# ============================================
# REDIRECCIONES DE MANTENIMIENTO
# ============================================

# Redirigir TODO a mantenimiento
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 200
  force = true

# Excepciones para archivos estáticos (que sigan funcionando)
[[redirects]]
  from = "/*.css"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/*.js"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/*.png"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/*.jpg"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/*.svg"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/*.webp"
  to = "/maintenance.html"
  status = 200
  force = true

# ============================================
# EXCEPCIÓN PARA EL LOGO
# ============================================

[[redirects]]
  from = "/wp-content/uploads/2023/11/Logo-Export-Campos-2.png"
  to = "/wp-content/uploads/2023/11/Logo-Export-Campos-2.png"
  status = 200

# ============================================
# RUTAS ADMINISTRATIVAS
# ============================================

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/cotizador"
  to = "/quote.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/maintenance-admin.html"
  status = 200

# ============================================
# REDIRECCIÓN .com → .cl
# ============================================

[[redirects]]
  from = "https://exportcampos.com/*"
  to = "https://exportcampos.cl/:splat"
  status = 301
  force = true

# ============================================
# HEADERS DE SEGURIDAD
# ============================================

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"